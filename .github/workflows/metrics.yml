name: GitHub Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"   # 06:00 IST daily

permissions:
  contents: write

concurrency:
  group: metrics-update
  cancel-in-progress: true

jobs:
  # =====================================================
  # JOB 1 — LIGHT PLUGINS (REST / LOW GRAPHQL)
  # =====================================================
  metrics-light:
    name: Metrics (light plugins)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Base profile
      - name: 📊 Base profile
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-base.svg
          template: classic
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
          base: header, activity, community, repositories, metadata
          base_indepth: yes

      # Languages
      - name: 📚 Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-languages.svg
          base: ""
          repositories_forks: no
          repositories_affiliations: owner
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_threshold: 1%

      # Isocalendar
      - name: 📅 Isocalendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-isometric.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Stars
      - name: ⭐ Stars
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-stars.svg
          base: ""
          plugin_stars: yes
          plugin_stars_limit: 5

      # Stargazers
      - name: 🌟 Stargazers
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-stargazers.svg
          base: ""
          repositories_forks: no
          plugin_stargazers: yes
          plugin_stargazers_charts: yes

      # Move + commit
      - name: 🚀 Commit light metrics
        run: |
          mkdir -p assets/metrics
          mv -f metrics-*.svg assets/metrics/ || true
      
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
          # Sync with remote BEFORE making changes
          git fetch origin main
          git rebase origin/main
      
          # Stage only generated metrics
          git add assets/metrics/*.svg
      
          # Exit if nothing changed
          if git diff --cached --quiet; then
            echo "✅ No changes to commit"
            exit 0
          fi
      
          # Commit and push
          git commit -m "chore(metrics): update light metrics [skip ci]"
          git push origin main


  # =====================================================
  # JOB 2 — HEAVY PLUGINS (GRAPHQL INTENSIVE)
  # =====================================================
  metrics-heavy:
    name: Metrics (heavy plugins)
    runs-on: ubuntu-latest
    needs: metrics-light

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Recent activity
      - name: 🎯 Recent activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-activity.svg
          base: ""
          plugins_errors_fatal: false
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_load: 50
          plugin_activity_days: 7
          plugin_activity_timestamps: yes

      # Achievements
      - name: 🏆 Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-achievements.svg
          base: ""
          plugins_errors_fatal: false
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C

      # Coding habits
      - name: 💡 Coding habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-habits.svg
          base: ""
          plugins_errors_fatal: false
          plugin_habits: yes
          plugin_habits_from: 30
          plugin_habits_days: 7
          plugin_habits_facts: yes
          plugin_habits_charts: yes

      # Move + commit
      - name: 🚀 Commit heavy metrics
        run: |
          mkdir -p assets/metrics
          mv -f metrics-*.svg assets/metrics/ || true
      
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
          # Sync with remote BEFORE making changes
          git fetch origin main
          git rebase origin/main
      
          # Stage generated metrics
          git add assets/metrics/*.svg
      
          # Exit if nothing changed
          if git diff --cached --quiet; then
            echo "✅ No changes to commit"
            exit 0
          fi
      
          # Commit and push
          git commit -m "chore(metrics): update heavy metrics [skip ci]"
          git push origin main
