name: GitHub Metrics

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics-update
  cancel-in-progress: true

jobs:
  metrics-and-readme:
    name: Generate metrics & update README
    runs-on: ubuntu-latest

    steps:
      # ---------------- Checkout ----------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit metrics & README
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore(metrics): update profile metrics"
          add: |
            assets/metrics/*
            README.md
          pull: '--rebase --autostash'

      # ---------------- Base profile ----------------
      - name: Base profile summary
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-base.svg
          config_timezone: Asia/Kolkata
          template: classic
          config_theme: dark
          base: header, activity, community, repositories
          base_indepth: yes

      # ---------------- Languages ----------------
      - name: Languages breakdown
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-languages.svg
          config_timezone: Asia/Kolkata
          template: classic
          config_theme: dark
          base: repositories
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss
          plugin_languages_limit: 10
          plugin_languages_details: bytes-size, percentage
          plugin_languages_threshold: 2%
          plugin_languages_colors: github

      # ---------------- Activity & calendar ----------------
      - name: Activity & calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-activity.svg
          config_timezone: Asia/Kolkata
          template: classic
          config_theme: dark
          base: activity
          plugin_activity: yes
          plugin_activity_days: 90
          plugin_activity_filter: all
          plugin_calendar: yes
          plugin_calendar_limit: 1

      # ---------------- Lines of code ----------------
      - name: Lines of code
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-lines.svg
          config_timezone: Asia/Kolkata
          template: classic
          config_theme: dark
          base: ""
          plugin_lines_sections: repositories
          plugin_lines_repositories_limit: 5
          plugin_lines_history_limit: 3

      # ---------------- Repositories ----------------
      - name: Repositories showcase
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-repos.svg
          config_timezone: Asia/Kolkata
          template: classic
          config_theme: dark
          base: ""
          plugin_repositories_starred: yes
          plugin_repositories_order: pinned, starred
          plugin_repositories_affiliations: owner

      # ---------------- Milestones ----------------
      - name: Milestones
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-milestones.svg
          config_timezone: Asia/Kolkata
          template: classic
          config_theme: dark
          base: ""
          plugin_milestones: yes
          plugin_milestones_threshold: 75%
          plugin_milestones_limit: 6

      # ---------------- Contributions stats ----------------
      - name: Contributions
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-contributions.svg
          config_timezone: Asia/Kolkata
          template: classic
          config_theme: dark
          base: ""
          plugin_contributors: yes
          plugin_contributors_contributions: yes
          plugin_contributors_sections: commits, issues, pulls

      # ---------------- Isometric calendar ----------------
      - name: Isometric contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-isometric.svg
          config_timezone: Asia/Kolkata
          template: classic
          config_theme: dark
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # ---------------- Organize assets ----------------
      - name: Move metrics to assets
        run: |
          mkdir -p assets/metrics
          mv -f metrics-*.svg assets/metrics/

      # ---------------- Update README ----------------
      - name: Update README metrics panel
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const path = 'README.md';
            const start = '<!-- METRICS:START -->';
            const end = '<!-- METRICS:END -->';

            const block = [
              start,
              '## 📈 Latest profile snapshot',
              '',
              '<div align="center">',
              '',
              '<img src="assets/metrics/metrics-base.svg" width="780"/>',
              '',
              '<p>',
              '<img src="assets/metrics/metrics-languages.svg" width="370"/>',
              '<img src="assets/metrics/metrics-activity.svg" width="370"/>',
              '</p>',
              '',
              '<p>',
              '<img src="assets/metrics/metrics-lines.svg" width="243"/>',
              '<img src="assets/metrics/metrics-repos.svg" width="243"/>',
              '<img src="assets/metrics/metrics-milestones.svg" width="243"/>',
              '</p>',
              '',
              '<p>',
              '<img src="assets/metrics/metrics-contributions.svg" width="370"/>',
              '<img src="assets/metrics/metrics-isometric.svg" width="370"/>',
              '</p>',
              '',
              '</div>',
              '',
              end
            ].join('\n');

            let readme = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : '# Sakth1\n';

            if (readme.includes(start) && readme.includes(end)) {
              const regex = new RegExp(`${start}[\\s\\S]*?${end}`, 'm');
              readme = readme.replace(regex, block);
            } else {
              readme += '\n\n' + block;
            }

            fs.writeFileSync(path, readme);

      # ---------------- Commit & push ----------------
      - name: Commit metrics & README
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore(metrics): update profile metrics"
          add: |
            assets/metrics/*
            README.md
          pull: '--rebase --autostash'
