name: GitHub Metrics (Dark Theme & Multiple SVGs)

on:
  schedule:
    # Runs once daily at 6:00 AM IST
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      # 1) Base Profile Summary (dark theme)
      - name: Base Profile Summary
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-base.svg
          config_timezone: Asia/Kolkata
          template: classic
          base: header, activity, community, repositories
          base_indepth: yes
          config_theme: dark

      # 2) Languages Breakdown (dark theme)
      - name: Languages Breakdown
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-languages.svg
          config_timezone: Asia/Kolkata
          template: classic
          config_theme: dark
          base: repositories
          plugin_languages: yes
          # ignore markup/web-design languages to emphasize programming / data
          plugin_languages_ignored: html, css, scss
          # limit to few dominant languages
          plugin_languages_limit: 10
          # show details by bytes and % usage
          plugin_languages_details: bytes-size, percentage
          plugin_languages_threshold: 2%
          plugin_languages_colors: github

      # 3) Activity + Calendar (dark theme)
      - name: Recent Activity + Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-activity.svg
          config_timezone: Asia/Kolkata
          template: classic
          config_theme: dark
          base: activity
          plugin_activity: yes
          # maybe 90-day window rather than 30 — reflects ongoing long-term projects
          plugin_activity_days: 90
          plugin_activity_filter: all
          plugin_activity_visibility: public
          plugin_calendar: yes
          plugin_calendar_limit: 1

      # 4) Code Volume & Lines Changed (dark theme) — optional, but good to show real work
      - name: Lines of Code & Repo Stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-lines.svg
          config_timezone: Asia/Kolkata
          template: classic
          config_theme: dark
          base: ""
          plugin_lines_sections: repositories
          plugin_lines_repositories_limit: 5
          # choose to display total lines changed over time (or diff history)
          plugin_lines_history_limit: 3

      # 5) Repositories showcase (pinned / starred / recent) — helps highlight StaTube
      - name: Repositories Showcase
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-repos.svg
          config_timezone: Asia/Kolkata
          template: classic
          config_theme: dark
          base: ""
          plugin_repositories_starred: yes
          plugin_repositories_random: no
          plugin_repositories_order: pinned, starred, random
          plugin_repositories_affiliations: owner

      # 6) Achievements / Stats overview (dark theme)
      - name: Achievements & Stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-achievements.svg
          config_timezone: Asia/Kolkata
          template: classic
          config_theme: dark
          base: ""
          plugin_achievements: yes
          # no threshold to show all achievements
          plugin_achievements_threshold: 0
          plugin_achievements_secrets: yes
          plugin_achievements_display: detailed
