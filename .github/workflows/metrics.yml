name: GitHub Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"   # 06:00 IST daily

permissions:
  contents: write

concurrency:
  group: metrics-update
  cancel-in-progress: true

jobs:
  metrics:
    name: Generate & publish profile metrics
    runs-on: ubuntu-latest

    steps:
      # ---------------- Checkout ----------------
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------- Base profile ----------------
      - name: Base profile summary
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-base.svg
          template: classic
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
          config_output: svg
          base: header, activity, community, repositories, metadata
          base_indepth: yes

      # ---------------- Languages (PUBLIC ONLY, NO FORKS) ----------------
      - name: Languages breakdown
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-languages.svg
          template: classic
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
          config_output: svg
          base: ""
          repositories_forks: no
          repositories_affiliations: owner
          plugin_languages: yes
          plugin_languages_limit: 10
          plugin_languages_details: bytes-size, percentage
          plugin_languages_threshold: 1%
          plugin_languages_colors: github
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 30

      # ---------------- Recent activity ----------------
      - name: Recent activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-activity.svg
          template: classic
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
          config_output: svg
          base: ""
          plugin_activity: yes
          plugin_activity_days: 90
          plugin_activity_filter: all
          plugin_activity_visibility: public
          plugin_activity_limit: 5
          repositories_affiliations: owner

      # ---------------- Lines of code ----------------
      - name: Lines of code changed
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-lines.svg
          template: classic
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
          config_output: svg
          base: ""
          repositories_forks: no
          plugin_lines: yes
          plugin_lines_sections: repositories, history
          plugin_lines_repositories_limit: 6
          plugin_lines_history_limit: 2

      # ---------------- Featured repositories ----------------
      - name: Featured repositories
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-repos.svg
          template: classic
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
          config_output: svg
          base: ""
          plugin_repositories: yes
          plugin_repositories_featured: ""
          plugin_repositories_pinned: 6
          plugin_repositories_order: featured, pinned, starred, random
          plugin_repositories_affiliations: owner

      # ---------------- Isometric calendar ----------------
      - name: Isometric commit calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-isometric.svg
          template: classic
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
          config_output: svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # ---------------- Achievements ----------------
      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-achievements.svg
          template: classic
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
          config_output: svg
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: B

      # ---------------- Notable contributions ----------------
      - name: Notable contributions
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-notable.svg
          template: classic
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
          config_output: svg
          base: ""
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_types: commit, issue, pull_request
          plugin_notable_repositories: yes

      # ---------------- Organize assets ----------------
      - name: Move metrics to assets
        run: |
          mkdir -p assets/metrics
          mv -f metrics-*.svg assets/metrics/ || true

      # ---------------- Commit & push ----------------
      - name: Commit & push metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add assets/metrics/*.svg

          if git diff --cached --quiet; then
            echo "✓ No changes to commit"
            exit 0
          fi

          git commit -m "chore(metrics): update profile metrics [skip ci]"
          git pull --rebase origin main
          git push origin main