name: GitHub Metrics

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "30 0 * * *"   # 06:00 IST daily

permissions:
  contents: write

concurrency:
  group: metrics-update
  cancel-in-progress: true

jobs:
  metrics:
    name: Generate & publish profile metrics
    runs-on: ubuntu-latest

    steps:
      # ---------------- Checkout ----------------
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------- Base profile ----------------
      - name: Base profile summary
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-base.svg
          template: classic
          config_theme: dark
          config_timezone: Asia/Kolkata
          base: header, community, repositories
          base_indepth: yes

      # ---------------- Languages (PUBLIC ONLY) ----------------
      - name: Languages breakdown
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-languages.svg
          template: classic
          config_theme: dark
          base: ""
          plugin_languages: yes
          plugin_languages_public: yes
          plugin_languages_limit: 10
          plugin_languages_details: bytes-size, percentage
          plugin_languages_threshold: 2%
          plugin_languages_colors: github

      # ---------------- Recent activity ----------------
      - name: Recent activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-activity.svg
          template: classic
          config_theme: dark
          base: ""
          plugin_activity: yes
          plugin_activity_days: 90
          plugin_activity_filter: all
          plugin_activity_visibility: public

      # ---------------- Lines of code ----------------
      - name: Lines of code
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-lines.svg
          template: classic
          config_theme: dark
          base: ""
          plugin_lines_sections: repositories
          plugin_lines_repositories_limit: 5
          plugin_lines_history_limit: 3

      # ---------------- Repositories ----------------
      - name: Repositories showcase
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-repos.svg
          template: classic
          config_theme: dark
          base: ""
          plugin_repositories_starred: yes
          plugin_repositories_order: pinned, starred
          plugin_repositories_affiliations: owner

      # ---------------- Milestones ----------------
      - name: Milestones
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-milestones.svg
          template: classic
          config_theme: dark
          base: ""
          plugin_milestones: yes
          plugin_milestones_threshold: 75%
          plugin_milestones_limit: 6

      # ---------------- Contributions ----------------
      - name: Contributions
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-contributions.svg
          template: classic
          config_theme: dark
          base: ""
          plugin_contributors: yes
          plugin_contributors_contributions: yes
          plugin_contributors_sections: commits, issues, pulls

      # ---------------- Isometric calendar ----------------
      - name: Isometric calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-isometric.svg
          template: classic
          config_theme: dark
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # ---------------- Organize assets ----------------
      - name: Move metrics to assets
        run: |
          rm -f assets/metrics/metrics-achievements.svg || true
          mkdir -p assets/metrics
          mv -f metrics-*.svg assets/metrics/

      # ---------------- Commit & push ----------------
      - name: Commit & push metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add assets/metrics/* README.md

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore(metrics): update profile metrics"
          git fetch origin main
          git push --force-with-lease
