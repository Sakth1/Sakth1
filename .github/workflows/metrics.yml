name: GitHub Metrics (Dark Theme & README update)

on:
  schedule:
    # Runs once every 2 days at 06:00 IST (00:30 UTC)
    - cron: "30 0 */2 * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Your existing metrics generation steps (kept as-is) ---
      - name: Base Profile Summary
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-base.svg
          config_timezone: Asia/Kolkata
          template: classic
          base: header, activity, community, repositories
          base_indepth: yes
          config_theme: dark

      - name: Languages Breakdown
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-languages.svg
          config_timezone: Asia/Kolkata
          template: classic
          config_theme: dark
          base: repositories
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss
          plugin_languages_limit: 10
          plugin_languages_details: bytes-size, percentage
          plugin_languages_threshold: 2%
          plugin_languages_colors: github

      - name: Recent Activity + Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-activity.svg
          config_timezone: Asia/Kolkata
          template: classic
          config_theme: dark
          base: activity
          plugin_activity: yes
          plugin_activity_days: 90
          plugin_activity_filter: all
          plugin_activity_visibility: public
          plugin_calendar: yes
          plugin_calendar_limit: 1

      - name: Lines of Code & Repo Stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-lines.svg
          config_timezone: Asia/Kolkata
          template: classic
          config_theme: dark
          base: ""
          plugin_lines_sections: repositories
          plugin_lines_repositories_limit: 5
          plugin_lines_history_limit: 3

      - name: Repositories Showcase
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-repos.svg
          config_timezone: Asia/Kolkata
          template: classic
          config_theme: dark
          base: ""
          plugin_repositories_starred: yes
          plugin_repositories_random: no
          plugin_repositories_order: pinned, starred, random
          plugin_repositories_affiliations: owner

      - name: Achievements & Stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-achievements.svg
          config_timezone: Asia/Kolkata
          template: classic
          config_theme: dark
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: 0
          plugin_achievements_secrets: yes
          plugin_achievements_display: detailed

      # --- Commit the generated SVGs into the repo under /assets/metrics ---
      - name: Create assets directory
        run: |
          mkdir -p assets/metrics
          ls -la

      - name: Move generated svgs to assets
        run: |
          # move any metrics-*.svg files to assets/metrics
          mv -f metrics-*.svg assets/metrics/  || true
          ls -la assets/metrics || true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit generated metrics images
        uses: EndBug/add-and-commit@v9
        with:
          author_name: github-actions[bot]
          author_email: github-actions[bot]@users.noreply.github.com
          message: "chore(metrics): update generated metrics svgs"
          add: "assets/metrics/*"
          push: true

      # --- Update README.md between markers with a visual panel referencing the generated svgs ---
      - name: Update README (insert metrics panel)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = 'README.md';
            const startMarker = '<!-- METRICS:START -->';
            const endMarker = '<!-- METRICS:END -->';
            const metricsSnippet = `
<!-- METRICS:START -->
## 📈 Latest profile snapshot

<div align="center">

<!-- main metrics -->
<img src="assets/metrics/metrics-base.svg" alt="Base metrics" width="780"/>

<!-- row: languages | activity -->
<p>
<img src="assets/metrics/metrics-languages.svg" alt="Languages" width="370" style="margin-right:8px"/>
<img src="assets/metrics/metrics-activity.svg" alt="Activity" width="370"/>
</p>

<!-- row: lines | repos | achievements -->
<p>
<img src="assets/metrics/metrics-lines.svg" alt="Lines" width="243" style="margin-right:8px"/>
<img src="assets/metrics/metrics-repos.svg" alt="Repos" width="243" style="margin-right:8px"/>
<img src="assets/metrics/metrics-achievements.svg" alt="Achievements" width="243"/>
</p>

</div>

### 🔦 Highlight
**StaTube** — a desktop YouTube analytics app (active project).  
- Repo: https://github.com/Sakth1/StaTube  
- Issues: https://github.com/Sakth1/StaTube/issues

**External contributions**
- Pull request: https://github.com/spyboy-productions/Valid8Proxy/pull/7
- External issue reports: https://github.com/YBTopaz8/Dimmer-MAUI/issues?q=is%3Aissue+author%3ASakth1+sort%3Aupdated-desc

**Planned / research**
- Digital-Harmony (concept/spec): https://github.com/Sakth1/Digital-Harmony

<!-- METRICS:END -->
`;
            // read README (or create it if missing)
            let readme = '';
            if (fs.existsSync(path)) {
              readme = fs.readFileSync(path, { encoding: 'utf8' });
            } else {
              readme = '# Sakth1\n\n';
            }

            if (readme.includes(startMarker) && readme.includes(endMarker)) {
              // replace block
              const regex = new RegExp(`${startMarker}[\\s\\S]*?${endMarker}`, 'm');
              readme = readme.replace(regex, metricsSnippet);
            } else {
              // append with markers
              readme += '\n' + metricsSnippet;
            }
            fs.writeFileSync(path, readme, { encoding: 'utf8' });
            // commit change
            const sha = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: path,
            }).then(res => res.data.sha).catch(() => null);

            const content = Buffer.from(readme, 'utf8').toString('base64');

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: path,
              message: 'chore(readme): update metrics panel',
              content: content,
              sha: sha || undefined,
              committer: { name: 'github-actions[bot]', email: 'github-actions[bot]@users.noreply.github.com' },
              author: { name: 'github-actions[bot]', email: 'github-actions[bot]@users.noreply.github.com' }
            });
