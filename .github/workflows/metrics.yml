name: GitHub Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"   # 06:00 IST daily

permissions:
  contents: write

concurrency:
  group: metrics-update
  cancel-in-progress: true

jobs:
  # =====================================================
  # JOB 1 — LIGHT PLUGINS (REST / LOW GRAPHQL)
  # =====================================================
  metrics-light:
    name: Metrics (light plugins)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Base profile
      - name: 📊 Base profile
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-base.svg
          template: classic
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
          base: header, activity, community, repositories, metadata
          base_indepth: yes

      # Languages
      - name: 📚 Languages
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-languages.svg
          base: ""
          repositories_forks: no
          repositories_affiliations: owner
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_threshold: 1%

      # Isocalendar
      - name: 📅 Isocalendar
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-isometric.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Stars
      - name: ⭐ Stars
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-stars.svg
          base: ""
          plugin_stars: yes
          plugin_stars_limit: 5

      # Stargazers
      - name: 🌟 Stargazers
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-stargazers.svg
          base: ""
          repositories_forks: no
          plugin_stargazers: yes
          plugin_stargazers_charts: yes

      # Move + commit
      - name: 🚀 Commit light metrics
        run: |
          # Create directory
          mkdir -p assets/metrics
          
          # Move generated files
          mv -f metrics-*.svg assets/metrics/ 2>/dev/null || echo "No files to move"
          
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage the files
          git add assets/metrics/*.svg
          
          # Check for changes
          if git diff --staged --quiet; then
            echo "✅ No changes to commit"
            exit 0
          fi
          
          # Commit
          git commit -m "chore(metrics): update light metrics [skip ci]"
          
          # Clean up any other unstaged changes
          git stash --include-untracked || true
          
          # Push with retry logic
          max_attempts=5
          attempt=1
          
          while [ $attempt -le $max_attempts ]; do
            echo "Push attempt $attempt of $max_attempts..."
            
            # Pull latest changes with rebase
            if git pull --rebase origin main; then
              # Try to push
              if git push origin main; then
                echo "✅ Successfully pushed changes"
                exit 0
              fi
            fi
            
            # If we get here, either pull or push failed
            if [ $attempt -lt $max_attempts ]; then
              echo "⚠️ Attempt $attempt failed, retrying in 5 seconds..."
              sleep 5
              attempt=$((attempt + 1))
            else
              echo "❌ Failed after $max_attempts attempts"
              exit 1
            fi
          done


  # =====================================================
  # JOB 2 — HEAVY PLUGINS (GRAPHQL INTENSIVE)
  # =====================================================
  metrics-heavy:
    name: Metrics (heavy plugins)
    runs-on: ubuntu-latest
    needs: metrics-light

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main  # Ensure we're on latest main

      # Recent activity (FIXED - filter all events)
      - name: 🎯 Recent activity
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-activity.svg
          base: ""
          plugins_errors_fatal: false
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_load: 300
          plugin_activity_days: 14
          plugin_activity_filter: all
          plugin_activity_visibility: all

      # Achievements (FIXED - removed projects query)
      - name: 🏆 Achievements
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-achievements.svg
          base: ""
          plugins_errors_fatal: false
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B
          plugin_achievements_ignored: >-
            octonaut, automator

      # Coding habits (FIXED - increased events)
      - name: 💡 Coding habits
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-habits.svg
          base: ""
          plugins_errors_fatal: false
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes

      # Move + commit
      - name: 🚀 Commit heavy metrics
        run: |
          # Create directory
          mkdir -p assets/metrics
          
          # Move generated files
          mv -f metrics-*.svg assets/metrics/ 2>/dev/null || echo "No files to move"
          
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage the files
          git add assets/metrics/*.svg
          
          # Check for changes
          if git diff --staged --quiet; then
            echo "✅ No changes to commit"
            exit 0
          fi
          
          # Commit
          git commit -m "chore(metrics): update heavy metrics [skip ci]"
          
          # Clean up any other unstaged changes
          git stash --include-untracked || true
          
          # Push with retry logic
          max_attempts=5
          attempt=1
          
          while [ $attempt -le $max_attempts ]; do
            echo "Push attempt $attempt of $max_attempts..."
            
            # Pull latest changes with rebase
            if git pull --rebase origin main; then
              # Try to push
              if git push origin main; then
                echo "✅ Successfully pushed changes"
                exit 0
              fi
            fi
            
            # If we get here, either pull or push failed
            if [ $attempt -lt $max_attempts ]; then
              echo "⚠️ Attempt $attempt failed, retrying in 5 seconds..."
              sleep 5
              attempt=$((attempt + 1))
            else
              echo "❌ Failed after $max_attempts attempts"
              exit 1
            fi
          done
